<!DOCTYPE html>
<html>
<head>
    <title>Clear Browser Cache</title>
</head>
<body>
    <h1>Clear Browser Cache for License Fee Fix</h1>
    <div id="status"></div>
    <br>
    <button onclick="clearAll()">Clear All Cache & Storage</button>
    <button onclick="location.reload(true)">Hard Reload</button>
    
    <script>
        function clearAll() {
            try {
                // Clear localStorage
                localStorage.clear();
                
                // Clear sessionStorage
                sessionStorage.clear();
                
                // Clear IndexedDB (if any)
                if ('indexedDB' in window) {
                    indexedDB.databases().then(databases => {
                        databases.forEach(db => {
                            if (db.name) {
                                indexedDB.deleteDatabase(db.name);
                            }
                        });
                    });
                }
                
                document.getElementById('status').innerHTML = '✅ Cleared all browser storage. Please refresh your app.';
                
                // Auto refresh after 2 seconds
                setTimeout(() => {
                    window.close();
                }, 2000);
                
            } catch (error) {
                document.getElementById('status').innerHTML = '❌ Error: ' + error.message;
            }
        }
        
        // Show current storage
        document.getElementById('status').innerHTML = `
            <h3>Current Storage:</h3>
            <p>localStorage items: ${localStorage.length}</p>
            <p>sessionStorage items: ${sessionStorage.length}</p>
            <p>Cluster override: ${localStorage.getItem('solana_cluster_override') || 'None'}</p>
        `;
    </script>
</body>
</html>
